services:
  server_minecraft:
    image: itzg/minecraft-server:latest
    container_name: "server_minecraft_neoforge"
    ports:
    - 25565:25565
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: 1.21.1
      NEOFORGE_VERSION: 21.1.234
      TZ: "Europe/Paris"
      DIFFICULTY: "hard"
      MAX_PLAYERS: 9
      SERVER_NAME: "Nazarick-Kingdom"
      INIT_MEMORY: "8G"
      MAX_MEMORY: "16G"
    volumes:
    - ./data:/data
    - ./mods:/mods:ro
